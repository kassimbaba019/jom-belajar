function parseP(s){
  const T=s.match(/[MLAC]|-?\d+(?:\.\d+)?/g);let i=0;const pts=[];let cur=null;

  const ln=(x,y)=>{if(!cur){add(x,y);return}const x0=cur[0],y0=cur[1],dx=x-x0,dy=y-y0,n=Math.ceil(Math.hypot(dx,dy)/4);for(let k=1;k<=n;k++)add(x0+dx*k/n,y0+dy*k/n)};
  const num=()=>+T[i++];
  while(i<T.length){const c=T[i++];
    if(c==="M"){const x=num(),y=num();add(x,y)}
    else if(c==="L"){const x=num(),y=num();ln(x,y)}
    else if(c==="A"){const cx=num(),cy=num(),rx=num(),ry=num(),a0=num()*Math.PI/180,a1=num()*Math.PI/180;

    else if(c==="C"){const x1=num(),y1=num(),x2=num(),y2=num(),x3=num(),y3=num(),x0=cur[0],y0=cur[1];
      for(let k=1;k<=28;k++){const u=k/28,v=1-u;add(v*v*v*x0+3*v*v*u*x1+3*v*u*u*x2+u*u*u*x3,v*v*v*y0+3*v*v*u*y1+3*v*u*u*y2+u*u*u*y3)}}
  }

}

    if(si>=ST.length){win();return}
    const m=$("#msg");if(m)m.textContent=L[lang].nextl;say(L[lang].nextl);if(lv<=2)startDemo()};
  cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if(S.locked||si>=ST.length)return;const p=pt(e),s=ST[si],tg=s[prog];demo=null;
    if(Math.hypot(p[0]-tg[0],p[1]-tg[1])<=(prog===0?54:62))drawing=true;
    else{S.firstTry=false;const m=(prog===0&&s[0][1]<150&&p[1]>s[0][1]+70)?L[lang].top:L[lang].dot;
      const mm=$("#msg");if(mm)mm.textContent=m;say(m);pulse=26;startDemo()}};
  cv.onpointermove=e=>{if(!drawing||S.locked)return;const p=pt(e),s=ST[si],hi=Math.min(s.length-1,prog+60);let best=-1,bd=1e9;
    for(let j=prog;j<=hi;j++){const d=Math.hypot(p[0]-s[j][0],p[1]-s[j][1]);if(d<bd){bd=d;best=j}}
    if(best>prog&&bd<=42)prog=best;
    if(prog>=s.length-7)finish()};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
  const frame=()=>{
    if(tok!==trTok||!document.body.contains(cv))return;fr++;c.clearRect(0,0,N,N);c.lineCap="round";c.lineJoin="round";
    ST.forEach((s,k)=>{path(s,0,s.length-1);c.lineWidth=46;c.strokeStyle="rgba(155,92,255,.2)";c.stroke()});
    ST.forEach((s,k)=>{if(k<si)return;path(s,0,s.length-1);c.lineWidth=4;c.setLineDash([10,10]);c.strokeStyle="#9B5CFF";c.stroke();c.setLineDash([])});
    ST.forEach((s,k)=>{const hi=k<si?s.length-1:k===si?prog:0;if(hi>0){path(s,0,hi);c.lineWidth=34;c.strokeStyle="#FF4D6D";c.stroke()}});
    if(lv<=3)ST.forEach((s,k)=>{if(k<si)return;for(let j=Math.max(14,k===si?prog+8:0);j<s.length-8;j+=15){const a=Math.atan2(s[j+3][1]-s[j-3][1],s[j+3][0]-s[j-3][0]);arrow(s[j][0],s[j][1],a)}});
    for(let k=ST.length-1;k>=si;k--){const s=ST[k],n=ST.length>1?k+1:"";
      if(k===si){if(prog===0){const pr=pulse>0?(pulse--,8*Math.abs(Math.sin(fr*.4))):0,r=20+3*Math.sin(fr*.15)+pr;dotAt(s[0],r,n,true)}
        else{c.beginPath();c.arc(s[prog][0],s[prog][1],13,0,7);c.strokeStyle="#fff";c.lineWidth=5;c.stroke()}}
      else dotAt(s[0],14,n,false)}
    if(demo){const s=ST[demo.s],n=s.length;demo.t++;const dur=Math.max(45,Math.min(110,n*.6)),u=Math.min(1,demo.t/dur),j=Math.min(n-1,Math.floor(u*(n-1)));
      path(s,0,j);c.lineWidth=14;c.strokeStyle="rgba(255,210,31,.9)";c.stroke();
      c.font="54px sans-serif";c.textAlign="center";c.textBaseline="top";c.fillStyle="#000";c.fillText("👆",s[j][0],s[j][1]-6);
      if(demo.t>dur+25)demo=null}
    requestAnimationFrame(frame)};
  frame();
  const m=$("#msg");if(m)m.textContent=L[lang].st;
  if(lv<=4)startDemo();
}
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const t=L[lang],a=b.dataset.act;
  if(a==="game")start(+b.dataset.v);
  else if(a==="home"){S.view="home";render()}
  else if(a==="age"){S.view="age";render();say(t.age)}
  else if(a==="setage"){S.age=+b.dataset.v;try{localStorage.setItem("age",S.age)}catch(_){}S.view="home";render()}
  else if(a==="key")hangGuess(b.dataset.v);
  else if(a==="hint")hangHint();
  else if(a==="say")say(spoken());
  else if(a==="clr")initTrace();
  else if(a==="demo"){if(trHint)trHint()}
  else if(a==="obj"){const i=+b.dataset.i;if(S.tapped.includes(i))return;S.tapped.push(i);b.classList.add("on");b.querySelector(".num").textContent=S.tapped.length;say(t.w[S.tapped.length-1])}
  else if(a==="ans"&&!S.locked){
    if(+b.dataset.v===S.R.ans)win(b);
    else{S.firstTry=false;b.classList.add("bad");$("#msg").textContent=t.no;say(t.no);tone([220])}
  }
});
$("header").addEventListener("click",e=>{
  if(e.target.closest("[data-act=voice]")){const p=$("#vp");p.hidden=!p.hidden;fillVoices();return}
  const b=e.target.closest("[data-act=lang]");if(!b)return;
  lang=b.dataset.v;try{localStorage.setItem("lang",lang)}catch(_){}if(S.view==="play"&&(S.game===3||S.game===8))makeRound(true);render();fillVoices();
});
$("#vsel").addEventListener("change",e=>{try{localStorage.setItem("voice_"+lang,e.target.value)}catch(_){}say(L[lang].t)});
$("#vtest").addEventListener("click",()=>say(L[lang].t));
loadVoices();render();
</script>
