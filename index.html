.t3{background:linear-gradient(135deg,#9B5CFF,#FF5FA2)}.credit{font-size:.7rem;color:rgba(255,255,255,.7);text-align:center;margin:10px 0 0}.tile.t3 .em,.tile.t4 .em,.tile.t7 .em,.tile.t8 .em{display:inline-block;width:clamp(76px,22vw,110px)}.tile.t3 .em svg,.tile.t4 .em svg,.tile.t7 .em svg,.tile.t8 .em svg{display:block;width:clamp(74px,21vw,92px);height:auto;margin:0 auto}.word{font-size:clamp(2.4rem,10vw,3.6rem);color:var(--ink);line-height:1.1}.opt.syl{font-size:clamp(2.2rem,9vw,3.4rem)}

.t5{background:linear-gradient(135deg,#29C7D9,#2D7DFF)}.t6{background:linear-gradient(135deg,#FF5FA2,#FFB037)}
.tw svg{width:100%;height:auto;display:block}.tw canvas.bl{aspect-ratio:4/5;background:linear-gradient(#BDE9FF,#FFE3F1)}.tw.bw{width:min(94vw,400px)}
.ctl{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-size:clamp(2.4rem,9vw,3.6rem)}.opt.fire{background:var(--sun)!important}
.t7{background:linear-gradient(135deg,#7CFF3A,#00C853 55%,#00A86B)}

.t0{background:linear-gradient(135deg,#FF4D6D,#FF8A1F)}.t1{background:linear-gradient(135deg,#2D7DFF,#7B5CFF)}.t2{background:linear-gradient(135deg,#1FB868,#29C7D9)}

.qm{width:clamp(38px,11vw,54px);height:clamp(38px,11vw,54px);border-radius:50%;border:4px dashed var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:1.6rem}
.blank{display:inline-block;min-width:1.6em;border-bottom:6px solid var(--b2)}
.obj.s{font-size:clamp(2rem,8vw,3rem);width:clamp(52px,13vw,70px);height:clamp(52px,13vw,70px)}

.opts{flex-wrap:wrap}

.agebtn.a4{background:var(--c0)}.agebtn.a5{background:var(--c1)}.agebtn.a6{background:var(--c2)}
.track{font-size:1.1rem;gap:3px}
.tile .em.tx{display:inline-block;width:clamp(76px,22vw,110px);text-align:center;font-size:clamp(2.4rem,10vw,3.4rem);letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.2)}.tile .em.tx.sm{font-size:clamp(1.7rem,7vw,2.3rem);letter-spacing:0}
.t8{background:linear-gradient(135deg,#7C5CFF,#29C7D9)}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ph{font-size:clamp(1.9rem,8vw,2.9rem)}.pbtn{margin:18px 0 0;font-size:1.05rem;opacity:.9}.chip.on{background:var(--panel);color:var(--ink)}
.gate{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}.gate .go{min-width:96px;padding:12px 26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 12px}.stats div{background:rgba(255,255,255,.22);border-radius:18px;padding:10px 4px}.stats b{display:block;font-size:1.6rem}.stats small{font-size:.8rem;opacity:.95}
.ins{background:var(--panel);color:var(--ink);border-radius:18px;padding:10px 14px;text-align:left;margin:0 0 12px;font-size:1rem;line-height:1.5;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.pgrid{display:grid;gap:10px;margin:0 0 14px}
.pc{background:var(--panel);color:var(--ink);border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 rgba(0,0,0,.15);text-align:left}
.pc .ic{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:#fff;font-weight:800;box-shadow:none}
.pc .pt{flex:1;min-width:0}.pc .pt b{display:block;font-size:1.05rem;line-height:1.15}.pc .pt small{display:block;font-size:.8rem;opacity:.75;margin-top:2px}
.lvd{display:flex;align-items:center;gap:3px;font-size:.65rem;flex:none}.lvd span{margin-right:3px;opacity:.7}.lvd i{width:9px;height:9px;border-radius:50%;background:#E2DDF3;display:inline-block}.lvd i.on{background:#7B4DFF}
.rh{font-size:1.2rem;margin:16px 0 6px;text-align:left}.rec{list-style:none;margin:0 0 10px;padding:0;text-align:left;background:rgba(255,255,255,.2);border-radius:18px;padding:8px 14px;font-size:.95rem;line-height:1.7}.rec span{opacity:.75;display:inline-block;min-width:3.4em}.rec em{opacity:.8;font-style:normal}.rec b{float:right}
.pnote{font-size:.8rem;opacity:.85;margin:6px 0 12px}

.t9{background:linear-gradient(135deg,#D8132F,#FF5C7A)}
.book{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 20px}

    if(S.locked||si>=ST.length)return;const p=pt(e),s=ST[si],tg=s[prog];demo=null;
    if(Math.hypot(p[0]-tg[0],p[1]-tg[1])<=(prog===0?RS:RR))drawing=true;
    else{S.firstTry=false;const m=(prog===0&&s[0][1]<TOP&&p[1]>s[0][1]+70*Math.max(.5,sc))?L[lang].top:L[lang].dot;
      const mm=$("#msg");if(mm)mm.textContent=m;say(m);pulse=26;startDemo()}};
  cv.onpointermove=e=>{if(!drawing||S.locked)return;const p=pt(e),s=ST[si],hi=Math.min(s.length-1,prog+60);let best=-1,bd=1e9;
    for(let j=prog;j<=hi;j++){const d=Math.hypot(p[0]-s[j][0],p[1]-s[j][1]);if(d<bd){bd=d;best=j}}
    if(best>prog&&bd<=TOL)prog=best;
    if(prog>=s.length-END)finish()};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
  const frame=()=>{
    if(tok!==trTok||!document.body.contains(cv))return;fr++;c.clearRect(0,0,N,N);c.lineCap="round";c.lineJoin="round";
    ST.forEach((s,k)=>{path(s,0,s.length-1);c.lineWidth=46*kw;c.strokeStyle="rgba(155,92,255,.2)";c.stroke()});
    ST.forEach((s,k)=>{if(k<si)return;path(s,0,s.length-1);c.lineWidth=4;c.setLineDash([10,10]);c.strokeStyle="#9B5CFF";c.stroke();c.setLineDash([])});
    ST.forEach((s,k)=>{const hi=k<si?s.length-1:k===si?prog:0;if(hi>0){path(s,0,hi);c.lineWidth=34*kw;c.strokeStyle="#FF4D6D";c.stroke()}});
    if(lv<=3)ST.forEach((s,k)=>{if(k<si)return;for(let j=Math.max(14,k===si?prog+8:0);j<s.length-8;j+=SK){const a=Math.atan2(s[j+3][1]-s[j-3][1],s[j+3][0]-s[j-3][0]);arrow(s[j][0],s[j][1],a)}});
    for(let k=ST.length-1;k>=si;k--){const s=ST[k],n=ST.length>1?k+1:"";
      if(k===si){if(prog===0){const pr=pulse>0?(pulse--,8*Math.abs(Math.sin(fr*.4))):0,r=(20+3*Math.sin(fr*.15)+pr)*Math.max(.7,q);dotAt(s[0],r,n,true)}
        else{c.beginPath();c.arc(s[prog][0],s[prog][1],13*Math.max(.7,q),0,7);c.strokeStyle="#fff";c.lineWidth=5;c.stroke()}}
      else dotAt(s[0],14*Math.max(.7,q),n,false)}
    if(demo){const s=ST[demo.s],n=s.length;demo.t++;const dur=Math.max(45,Math.min(110,n*.6)),u=Math.min(1,demo.t/dur),j=Math.min(n-1,Math.floor(u*(n-1)));
      path(s,0,j);c.lineWidth=14*kw;c.strokeStyle="rgba(255,210,31,.9)";c.stroke();
      c.font=Math.round(54*Math.max(.7,q))+"px sans-serif";c.textAlign="center";c.textBaseline="top";c.fillStyle="#000";c.fillText("👆",s[j][0],s[j][1]-6);
      if(demo.t>dur+25)demo=null}
    requestAnimationFrame(frame)};
  frame();
  const m=$("#msg");if(m)m.textContent=L[lang].st;
  if(lv<=4)startDemo();
}
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const t=L[lang],a=b.dataset.act;
  if(a==="game")start(+b.dataset.v);
  else if(a==="home"){S.view="home";render()}
  else if(a==="age"){S.view="age";render();say(t.age)}
  else if(a==="setage"){S.age=+b.dataset.v;try{localStorage.setItem("age",S.age)}catch(_){}S.view="home";render()}
  else if(a==="key")hangGuess(b.dataset.v);
  else if(a==="hint")hangHint();
  else if(a==="book"){S.view="book";render();say(t.book)}
  else if(a==="parents"){const x=R_(11,19),y=R_(6,9),c=x+y,ch=shuf([c,c+1,c-1,c+10].filter((v,i,ar)=>ar.indexOf(v)===i));S.gq={a:x,b:y,ans:c,ch};S.pgate=false;S.gerr=false;S.pa=S.age||5;S.view="parents";render()}
  else if(a==="gate"){if(+b.dataset.v===S.gq.ans){S.pgate=true;S.gerr=false}else S.gerr=true;render()}
  else if(a==="pa"){S.pa=+b.dataset.v;S.rc=0;render()}
  else if(a==="reset"){if(S.rc){done={};hist={};act=[];try{Object.keys(localStorage).filter(k=>/^lv\d/.test(k)).forEach(k=>localStorage.removeItem(k));localStorage.removeItem("done");localStorage.removeItem("hist");localStorage.removeItem("act")}catch(_){}S.rc=0;render()}else{S.rc=1;b.textContent=t.sure}}
  else if(a==="stk"){const o=STK[+b.dataset.i];say(o[lang]);b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}
  else if(a==="say")say(spoken());
  else if(a==="clr")initTrace();
  else if(a==="demo"){if(trHint)trHint()}
  else if(a==="obj"){const i=+b.dataset.i;if(S.tapped.includes(i))return;S.tapped.push(i);b.classList.add("on");b.querySelector(".num").textContent=S.tapped.length;say(t.w[S.tapped.length-1])}
  else if(a==="ans"&&!S.locked){
    if(+b.dataset.v===S.R.ans)win(b);
    else{S.firstTry=false;b.classList.add("bad");$("#msg").textContent=t.no;say(t.no);tone([220])}
  }
});
$("header").addEventListener("click",e=>{
  if(e.target.closest("[data-act=voice]")){const p=$("#vp");p.hidden=!p.hidden;fillVoices();return}
  const b=e.target.closest("[data-act=lang]");if(!b)return;
  lang=b.dataset.v;try{localStorage.setItem("lang",lang)}catch(_){}if(S.view==="play"&&(S.game===3||S.game===8||(S.game===9&&S.sub===3)))makeRound(true);render();fillVoices();
});
$("#vsel").addEventListener("change",e=>{try{localStorage.setItem("voice_"+lang,e.target.value)}catch(_){}say(L[lang].t)});
$("#vtest").addEventListener("click",()=>say(L[lang].t));
loadVoices();render();
</script>
